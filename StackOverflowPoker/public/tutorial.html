
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tutorial - Stack Overflow Poker</title>

    <link rel="icon" href="/images/logo.svg" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div id="siteNav"></div>
    <script src="/js/nav.js"></script>

    <main class="container pb-5">
        <header class="page-header">
            <h1 class="page-title">How to Play Seven-Card Stud</h1>
            <p class="page-subtitle">
                Learn the basics before joining a poker table.
            </p>
        </header>

        <div class="row g-4">
            <div class="col-lg-8">
                <div class="so-card">
                    <p id="stepNumber" class="text-secondary"></p>
                    <h2 id="stepTitle" class="h4"></h2>
                    <p id="stepText"></p>

                    <div class="d-flex justify-content-between mt-4">
                        <button id="previousButton"
                                class="btn btn-light-soft">
                            Previous
                        </button>

                        <button id="nextButton"
                                class="btn btn-primary">
                            Next
                        </button>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="so-card">
                    <h2 class="h5">Poker Hand Rankings</h2>
                    <p class="text-secondary small">
                        From strongest to weakest:
                    </p>

                    <ol>
                        <li>Royal Flush</li>
                        <li>Straight Flush</li>
                        <li>Four of a Kind</li>
                        <li>Full House</li>
                        <li>Flush</li>
                        <li>Straight</li>
                        <li>Three of a Kind</li>
                        <li>Two Pair</li>
                        <li>One Pair</li>
                        <li>High Card</li>
                    </ol>
                </div>
            </div>
        </div>
    </main>

    <script>
        // BT-02: Tutorial steps
        const steps = [
            {
                title: "Join a Table",
                text: "Open the Lobby and join a public table or create your own table."
            },
            {
                title: "Start the Game",
                text: "Seven-Card Stud is played with 2 to 7 players. Start a round when enough players have joined."
            },
            {
                title: "Get Your First Cards",
                text: "Each player starts with three cards. Two are face down and one is face up."
            },
            {
                title: "Choose Your Action",
                text: "During betting, you can Fold to leave the hand, Check if you do not need to bet, Call to match a bet, or Raise to increase it."
            },
            {
                title: "Receive More Cards",
                text: "More cards are dealt during the round, with betting between deals. Each player eventually receives seven cards."
            },
            {
                title: "Win the Hand",
                text: "At the showdown, players use their best five cards out of seven. The strongest poker hand wins the pot."
            }
        ];

        let currentStep = 0;

        const stepNumber = document.getElementById("stepNumber");
        const stepTitle = document.getElementById("stepTitle");
        const stepText = document.getElementById("stepText");
        const previousButton = document.getElementById("previousButton");
        const nextButton = document.getElementById("nextButton");

        function showStep() {
            const step = steps[currentStep];

            stepNumber.textContent =
                "Step " + (currentStep + 1) + " of " + steps.length;

            stepTitle.textContent = step.title;
            stepText.textContent = step.text;

            previousButton.disabled = currentStep === 0;

            if (currentStep === steps.length - 1) {
                nextButton.textContent = "Restart";
            } else {
                nextButton.textContent = "Next";
            }
        }

        previousButton.addEventListener("click", function() {
            if (currentStep > 0) {
                currentStep--;
                showStep();
            }
        });

        nextButton.addEventListener("click", function() {
            if (currentStep === steps.length - 1) {
                currentStep = 0;
            } else {
                currentStep++;
            }

            showStep();
        });

        showStep();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
