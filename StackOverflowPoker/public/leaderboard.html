<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Leaderboard - Stack Overflow Poker</title>
    <link rel="icon" href="/images/logo.svg" type="image/svg+xml">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">

    <style>
        .podium {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            align-items: end;
            gap: 1rem;
            max-width: 760px;
            margin: 0 auto 2rem;
        }

        .podium-spot { text-align: center; }

        .podium-spot .avatar { margin-bottom: .6rem; }

        .podium-name {
            font-weight: 700;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .podium-block {
            margin-top: .7rem;
            border-radius: 18px 18px 6px 6px;
            color: #fff;
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
        }

        .podium-block small { font-size: .78rem; font-weight: 600; opacity: .9; font-family: var(--font-body); }
        .spot-1 .podium-block { height: 170px; background: linear-gradient(160deg, #ffe08a, var(--gold) 45%, var(--gold-600)); color: #3a2a00; }
        .spot-2 .podium-block { height: 130px; background: linear-gradient(160deg, #e6e3ea, #b9b3c0); color: #2f2838; }
        .spot-3 .podium-block { height: 105px; background: linear-gradient(160deg, #f2b98a, #c9783f); }
        .spot-1 .avatar { --size: 84px; box-shadow: 0 0 0 4px var(--gold), var(--shadow); }
        .spot-1 .crown { color: var(--gold-600); font-size: 1.6rem; display: block; margin-bottom: .2rem; }

        .current-player { background: var(--brand-50) !important; }
        .current-player td { font-weight: 700; }

        .rank-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            font-weight: 700;
            background: #f2eff4;
            color: var(--ink-soft);
        }

        .rank-1 { background: #fff1c2; color: #8a6400; }
        .rank-2 { background: #ecebef; color: #4b4555; }
        .rank-3 { background: #f8dcc7; color: #8b4a1c; }

        .mini-bar {
            height: 6px;
            border-radius: 999px;
            background: #f1e9f4;
            overflow: hidden;
            min-width: 80px;
        }

        .mini-bar span {
            display: block;
            height: 100%;
            border-radius: 999px;
            background: linear-gradient(90deg, #cf55cf, var(--brand-700));
        }

        @media (max-width: 575.98px) {
            .podium { gap: .5rem; }
            .podium-block { font-size: 1.5rem; }
            .spot-1 .podium-block { height: 130px; }
            .spot-2 .podium-block { height: 100px; }
            .spot-3 .podium-block { height: 80px; }
        }
    </style>
</head>
<body>
    <div id="siteNav"></div>
    <script src="/js/nav.js"></script>

    <main class="container pb-5">
        <header class="page-header text-center fade-up">
            <span class="eyebrow"><i class="bi bi-trophy-fill"></i>Leaderboard</span>
            <h1 class="page-title">Top players</h1>
            <p class="page-subtitle">Compare your record with the top 10 players.</p>
        </header>

        <!-- Error message -->
        <div id="errorMessage" class="alert alert-danger d-none rounded-4"></div>

        <!-- Top three -->
        <div class="podium fade-up delay-1" id="podium" aria-label="Top three players"></div>

        <!-- Leaderboard table -->
        <div class="so-card p-0 overflow-hidden fade-up delay-2">
            <div class="table-responsive">
                <table class="so-table text-center mb-0">
                    <thead>
                        <tr>
                            <th>Rank</th>
                            <th class="text-start">Player</th>
                            <th>Wins</th>
                            <th>Losses</th>
                            <th>Win %</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboardBody">
                        <tr><td colspan="5" class="text-secondary py-4">Loading leaderboard...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Buttons -->
        <div class="d-flex flex-wrap gap-2 justify-content-center mt-4">
            <button class="btn btn-primary" onclick="loadLeaderboard()">
                <i class="bi bi-arrow-clockwise"></i>Refresh Leaderboard
            </button>
            <a id="backLink" href="/home.html" class="btn btn-light-soft">
                <i class="bi bi-house-door-fill"></i>Back to Home
            </a>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container d-flex flex-wrap justify-content-between gap-2">
            <span>&copy; Stack Overflow Chips &middot; Virtual chips only, no real-money gambling.</span>
            <span class="suits" aria-hidden="true">♠ ♥ ♣ ♦</span>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- ST-02 JavaScript -->
    <script>
        let username = null;

        function podiumSpot(player, place) {
            const spot = document.createElement("div");
            spot.className = "podium-spot spot-" + place;
            if (!player) {
                spot.innerHTML =
                    '<span class="avatar" style="background:#f1eaf4;color:#b7a3c2;box-shadow:none;">?</span>' +
                    '<div class="podium-name text-secondary">Open spot</div>' +
                    '<div class="podium-block">' + place + "</div>";
                return spot;
            }
            spot.innerHTML =
                (place === 1 ? '<i class="bi bi-trophy-fill crown" aria-hidden="true"></i>' : "") +
                SOP.avatarHtml(player.username, "avatar-lg") +
                '<div class="podium-name"></div>' +
                '<div class="text-secondary small">' + player.wins + " wins · " + player.winPercentage + "%</div>" +
                '<div class="podium-block">' + place + "<small>place</small></div>";
            spot.querySelector(".podium-name").textContent = player.username;
            return spot;
        }

        // ST-02: Load leaderboard from server
        async function loadLeaderboard() {
            const tableBody = document.getElementById("leaderboardBody");
            const podium = document.getElementById("podium");
            const errorBox = document.getElementById("errorMessage");

            errorBox.classList.add("d-none");
            tableBody.innerHTML = '<tr><td colspan="5" class="text-secondary py-4">Loading leaderboard...</td></tr>';

            try {
                const response = await fetch("/api/leaderboard", { cache: "no-store" });
                if (!response.ok) {
                    throw new Error("Failed to load leaderboard.");
                }

                const players = await response.json();

                // Podium order: 2nd, 1st, 3rd
                podium.replaceChildren(
                    podiumSpot(players[1], 2),
                    podiumSpot(players[0], 1),
                    podiumSpot(players[2], 3)
                );

                tableBody.innerHTML = "";

                if (players.length === 0) {
                    tableBody.innerHTML =
                        '<tr><td colspan="5"><div class="empty-state"><i class="bi bi-trophy"></i>' +
                        "<strong>No players yet</strong>Play a few hands to get on the board.</div></td></tr>";
                    return;
                }

                players.forEach(function (player) {
                    const row = document.createElement("tr");

                    // Highlight current player
                    if (username === player.username) {
                        row.classList.add("current-player");
                    }

                    const rankClass = player.rank <= 3 ? " rank-" + player.rank : "";
                    row.innerHTML =
                        '<td><span class="rank-badge' + rankClass + '">' + player.rank + "</span></td>" +
                        '<td class="text-start"><div class="d-flex align-items-center gap-2">' +
                            SOP.avatarHtml(player.username, "avatar-sm") + '<span class="player-name fw-semibold"></span>' +
                            (username === player.username ? '<span class="pill ms-1">You</span>' : "") +
                        "</div></td>" +
                        '<td class="text-success fw-semibold">' + player.wins + "</td>" +
                        '<td class="text-danger fw-semibold">' + player.losses + "</td>" +
                        '<td><div class="d-flex align-items-center gap-2 justify-content-center">' +
                            '<div class="mini-bar flex-grow-1"><span style="width:' + Number(player.winPercentage) + '%"></span></div>' +
                            "<span>" + player.winPercentage + "%</span></div></td>";
                    row.querySelector(".player-name").textContent = player.username;

                    tableBody.appendChild(row);
                });

            } catch (error) {
                errorBox.textContent = error.message;
                errorBox.classList.remove("d-none");
                tableBody.innerHTML = "";
                podium.replaceChildren();
            }
        }

        // Wait for nav.js so the signed-in player's row can be highlighted
        SOP.ready.then(function () {
            username = SOP.user;
            loadLeaderboard();
        });
    </script>
</body>
</html>
