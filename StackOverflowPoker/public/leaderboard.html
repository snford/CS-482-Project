<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Leaderboard - Stack Overflow Poker</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Existing website CSS -->
    <link rel="stylesheet" href="css/styles.css">

    <style>
        .current-player {
            background-color: #e6c7ed;
            font-weight: bold;
        }

        .leaderboard-container {
            max-width: 950px;
            margin: auto;
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-sm navbar-dark navbar-purple">
        <div class="container-fluid">

            <ul class="navbar-nav">

                <li class="nav-item">
                    <a class="nav-link" id="homeLink" href="home.html">
                        <span class="logo-placeholder">Logo</span>
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link mt-2" href="lobby.html">
                        Lobby
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link mt-2" id="friendsLink" href="friends.html">
                        Friends
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link mt-2" id="statsLink" href="stats.html">
                        Stats
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link mt-2 active" href="leaderboard.html">
                        Leaderboard
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link mt-2" href="profile.html">
                        Profile
                    </a>
                </li>

            </ul>

        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-5 leaderboard-container">

        <h1 class="text-center mb-3">
            🏆 Player Leaderboard
        </h1>

        <p class="text-center mb-4">
            Compare your score with the top 10 players!
        </p>

        <!-- Error message -->
        <div id="errorMessage" class="alert alert-danger d-none"></div>

        <!-- Leaderboard table -->
        <div class="table-responsive">

            <table class="table table-bordered table-striped text-center">

                <thead class="table-dark">
                    <tr>
                        <th>Rank</th>
                        <th>Username</th>
                        <th>Wins</th>
                        <th>Losses</th>
                        <th>Win Percentage</th>
                    </tr>
                </thead>

                <tbody id="leaderboardBody">

                    <tr>
                        <td colspan="5">
                            Loading leaderboard...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

        <!-- Buttons -->
        <div class="text-center mt-4">

            <button class="btn btn-primary" onclick="loadLeaderboard()">
                Refresh Leaderboard
            </button>

            <a id="backLink" href="home.html" class="btn btn-secondary">
                Back to Home
            </a>

        </div>

    </div>

    <!-- ST-02 JavaScript -->
    <script>

        // Get username from URL
        const params = new URLSearchParams(window.location.search);
        const username = params.get("username");

        // Keep username when navigating
        if (username !== null) {

            const pages = {
                homeLink: "home.html",
                friendsLink: "friends.html",
                statsLink: "stats.html",
                backLink: "home.html"
            };

            for (const id in pages) {

                document.getElementById(id).href =
                    pages[id] + "?username=" +
                    encodeURIComponent(username);

            }
        }

        // ST-02: Load leaderboard from server
        async function loadLeaderboard() {

            const tableBody = document.getElementById("leaderboardBody");
            const errorBox = document.getElementById("errorMessage");

            errorBox.classList.add("d-none");

            tableBody.innerHTML =
                '<tr><td colspan="5">Loading leaderboard...</td></tr>';

            try {

                // Request player rankings
                const response = await fetch("/api/leaderboard");

                if (!response.ok) {
                    throw new Error("Failed to load leaderboard.");
                }

                const players = await response.json();

                // Clear previous rows
                tableBody.innerHTML = "";

                // No players found
                if (players.length === 0) {

                    const row = document.createElement("tr");
                    const cell = document.createElement("td");

                    cell.colSpan = 5;
                    cell.textContent = "No players found.";

                    row.appendChild(cell);
                    tableBody.appendChild(row);

                    return;
                }

                // Add each player to the table
                players.forEach(function(player) {

                    const row = document.createElement("tr");

                    // Highlight current player
                    if (username === player.username) {
                        row.classList.add("current-player");
                    }

                    // Add medals for top three players
                    let rank = player.rank;

                    if (rank === 1) {
                        rank = "🥇 1";
                    } else if (rank === 2) {
                        rank = "🥈 2";
                    } else if (rank === 3) {
                        rank = "🥉 3";
                    }

                    // Player information
                    const values = [
                        rank,
                        player.username,
                        player.wins,
                        player.losses,
                        player.winPercentage + "%"
                    ];

                    // Create table cells
                    values.forEach(function(value) {

                        const cell = document.createElement("td");

                        cell.textContent = value;

                        row.appendChild(cell);

                    });

                    tableBody.appendChild(row);

                });

            } catch (error) {

                errorBox.textContent = error.message;
                errorBox.classList.remove("d-none");

                tableBody.innerHTML = "";

            }
        }

        // Load leaderboard when page opens
        loadLeaderboard();

    </script>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
