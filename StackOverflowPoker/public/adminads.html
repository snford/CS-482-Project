<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Ads - Stack Overflow Poker</title>
    <link rel="icon" href="/images/logo.svg" type="image/svg+xml">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/createTable.css">
</head>
<body>
    <div id="siteNav" data-variant="admin"></div>
    <script src="/js/nav.js"></script>

    <main class="container pb-5">
        <header class="page-header d-flex flex-wrap align-items-end justify-content-between gap-3 fade-up">
            <div>
                <span class="eyebrow"><i class="bi bi-megaphone-fill"></i>Admin dashboard</span>
                <h1 class="page-title">Manage ads</h1>
                <p class="page-subtitle">Create ads and choose where and when they appear.</p>
            </div>
           
        </header>

        <div class="row g-4">
            <div class="col-lg-7 fade-up delay-1">
                <div class="so-card p-0 overflow-hidden h-100">
                    <table class="so-table">
                        <thead>
                            <tr><th>Ad</th><th>Placement</th><th>Interval</th><th>Active</th></tr>
                        </thead>
                        <tbody id="adsList">
                            <tr>
                                <td colspan="4">Loading ads...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="col-lg-5 fade-up delay-2">
                <div class="so-card">
                    <h2 class="so-card-title"><i class="bi bi-plus-square-fill"></i>New ad</h2>
                    <form id="adForm">
                        <label class="form-label" for="adName">Ad name</label>
                        <input class="form-control mb-3" id="adName" type="text" placeholder="Casino promo" required>

                        <label class="form-label" for="adImage">Image Path</label>
                        <input class="form-control mb-3"
                               id="adImage"
                               type="text"
                               placeholder="/images/promo.png"
                               required>

                        <label class="form-label" for="adLink">Link URL</label>
                        <input class="form-control mb-3" id="adLink" type="url" placeholder="https://" required>

                        <label class="form-label" for="adPlacement">Placement</label>

                        <select class="form-select mb-3" id="adPlacement">
                            <option value="lobby">Lobby</option>
                            <option value="table">Table</option>
                        </select>
                        
                        <label class="form-label" for="adInterval">
                            Rotation Interval (minutes)
                        </label>
                        
                        <input class="form-control mb-3"
                               id="adInterval"
                               type="number"
                               value="5"
                               min="1"
                               step="1"
                               required>

                        <div class="form-check form-switch mb-4">
                            <input class="form-check-input" type="checkbox" role="switch" id="adActive" checked>
                            <label class="form-check-label" for="adActive">Active</label>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-floppy-fill"></i>Save ad
                        </button>
                    </form>
                    <p id="adMessage" class="mt-3"></p>
                </div>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container d-flex flex-wrap justify-content-between gap-2">
            <span>&copy; Stack Overflow Chips &middot; Admin tools</span>
            <span class="suits" aria-hidden="true">♠ ♥ ♣ ♦</span>
        </div>
    </footer>

    
    <script>
        // AV-01: Show saved advertisements
        async function loadAds() {
            const list = document.getElementById("adsList");
    
            try {
                const response = await fetch("/api/admin/ads");
    
                if (!response.ok) {
                    throw new Error("Could not load ads");
                }
    
                const ads = await response.json();
                list.innerHTML = "";
    
                if (ads.length === 0) {
                    const row = list.insertRow();
                    const cell = row.insertCell();
                    cell.colSpan = 4;
                    cell.textContent = "No ads yet.";
                    return;
                }
    
                for (const ad of ads) {
                    const row = list.insertRow();
    
                    const nameCell = row.insertCell();
    
                    const image = document.createElement("img");
                    image.src = ad.imageUrl;
                    image.alt = ad.name;
                    image.width = 60;
    
                    const name = document.createElement("p");
                    name.textContent = ad.name;
    
                    nameCell.appendChild(image);
                    nameCell.appendChild(name);
    
                    row.insertCell().textContent = ad.placement;
                    row.insertCell().textContent =
                        ad.intervalMinutes + " min";
                    row.insertCell().textContent =
                        ad.active ? "Yes" : "No";
                }
    
            } catch (error) {
                list.innerHTML = "";
                const row = list.insertRow();
                const cell = row.insertCell();
                cell.colSpan = 4;
                cell.textContent = "Could not load ads.";
            }
        }
    
        // AV-01: Save a new advertisement
        document.getElementById("adForm").onsubmit =
            async function(event) {
                event.preventDefault();
    
                const message = document.getElementById("adMessage");
    
                const ad = {
                    name: document.getElementById("adName").value.trim(),
                    imageUrl: document.getElementById("adImage").value.trim(),
                    linkUrl: document.getElementById("adLink").value.trim(),
                    placement: document.getElementById("adPlacement").value,
                    intervalMinutes: Number(
                        document.getElementById("adInterval").value
                    ),
                    active: document.getElementById("adActive").checked
                };
    
                try {
                    const response = await fetch("/api/admin/ads", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(ad)
                    });
    
                    const result = await response.json();
                    message.textContent = result.msg;
    
                    if (response.ok) {
                        document.getElementById("adForm").reset();
                        loadAds();
                    }
    
                } catch (error) {
                    message.textContent = "Could not save ad.";
                }
            };
    
        loadAds();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
