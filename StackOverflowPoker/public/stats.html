
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Player Statistics - Stack Overflow Poker</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Existing project CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-sm navbar-dark navbar-purple">
        <div class="container-fluid">
            <ul class="navbar-nav">

                <li class="nav-item">
                    <a class="nav-link" id="homeLink" href="home.html">
                        <span class="logo-placeholder">Logo</span>
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link mt-2" id="lobbyLink" href="lobby.html">
                        Lobby
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link mt-2" id="friendsLink" href="friends.html">
                        Friends
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link mt-2 active" id="statsLink" href="stats.html">
                        Stats
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link mt-2" id="profileLink" href="profile.html">
                        Profile
                    </a>
                </li>

            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-5">

        <h1 class="text-center mb-4">
            Player Statistics
        </h1>

        <!-- Player Name -->
        <h4 class="text-center mb-4" id="playerName">
            Loading...
        </h4>

        <!-- Error Message -->
        <div
            id="errorMessage"
            class="alert alert-danger d-none">
        </div>

        <!-- Statistics Section -->
        <div id="statsContent" class="d-none">

            <div class="row text-center">

                <!-- Wins Card -->
                <div class="col-md-4 mb-3">
                    <div class="card shadow-sm">
                        <div class="card-body">

                            <h3>Wins</h3>

                            <h2 class="text-success" id="wins">
                                0
                            </h2>

                        </div>
                    </div>
                </div>

                <!-- Losses Card -->
                <div class="col-md-4 mb-3">
                    <div class="card shadow-sm">
                        <div class="card-body">

                            <h3>Losses</h3>

                            <h2 class="text-danger" id="losses">
                                0
                            </h2>

                        </div>
                    </div>
                </div>

                <!-- Win Percentage Card -->
                <div class="col-md-4 mb-3">
                    <div class="card shadow-sm">
                        <div class="card-body">

                            <h3>Win Percentage</h3>

                            <h2 id="winPercentage">
                                0%
                            </h2>

                        </div>
                    </div>
                </div>

            </div>

            <!-- Total Games -->
            <div class="text-center mt-4">
                <h4>
                    Total Games Played:
                    <span id="totalGames">0</span>
                </h4>
            </div>

            <!-- Win Percentage Bar -->
            <div class="mt-4">

                <h5>Win Rate</h5>

                <div class="progress" style="height: 25px;">

                    <div
                        id="winProgress"
                        class="progress-bar bg-success"
                        role="progressbar"
                        style="width: 0%;"
                        aria-valuenow="0"
                        aria-valuemin="0"
                        aria-valuemax="100">
                        0%
                    </div>

                </div>
            </div>

        </div>

        <!-- Back Button -->
        <div class="text-center mt-4">
            <a id="backLink" href="home.html" class="btn btn-primary">
                Back to Home
            </a>
        </div>

    </div>

    <!-- ST-01 JavaScript -->
    <script>

        // Get the username from the website URL
        let params = new URLSearchParams(window.location.search);
        let username = params.get("username");

        // Keep the username when navigating to other pages
        if (username) {

            let pages = {
                homeLink: "home.html",
                lobbyLink: "lobby.html",
                friendsLink: "friends.html",
                statsLink: "stats.html",
                profileLink: "profile.html",
                backLink: "home.html"
            };

            for (let id in pages) {
                document.getElementById(id).href =
                    pages[id] + "?username=" +
                    encodeURIComponent(username);
            }
        }

        // Load player statistics from MongoDB through the server
        async function loadStats() {

            // Make sure a username was provided
            if (!username) {
                showError("Please log in to view your statistics.");
                return;
            }

            try {

                // Request statistics from our Express API
                let response = await fetch(
                    "/stats/" + encodeURIComponent(username)
                );

                // Check if the request worked
                if (!response.ok) {
                    throw new Error("Unable to load player statistics.");
                }

                // Convert the server response into JavaScript data
                let stats = await response.json();

                // Display the username
                document.getElementById("playerName").textContent =
                    "Player: " + stats.username;

                // Display wins
                document.getElementById("wins").textContent =
                    stats.wins;

                // Display losses
                document.getElementById("losses").textContent =
                    stats.losses;

                // Display win percentage
                document.getElementById("winPercentage").textContent =
                    stats.winPercentage + "%";

                // Display total games
                document.getElementById("totalGames").textContent =
                    stats.totalGames;

                // Update the win percentage bar
                let progress = document.getElementById("winProgress");

                progress.style.width = stats.winPercentage + "%";

                progress.textContent = stats.winPercentage + "%";

                progress.setAttribute(
                    "aria-valuenow",
                    stats.winPercentage
                );

                // Show the statistics section
                document.getElementById("statsContent")
                    .classList.remove("d-none");

            } catch (error) {

                showError(error.message);

            }
        }

        // Show an error message
        function showError(message) {

            document.getElementById("playerName").textContent =
                "Statistics unavailable";

            let errorBox = document.getElementById("errorMessage");

            errorBox.textContent = message;

            errorBox.classList.remove("d-none");
        }

        // Run when the page opens
        loadStats();

    </script>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
