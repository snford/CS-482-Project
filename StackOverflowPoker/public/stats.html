<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Player Statistics - Stack Overflow Poker</title>
    <link rel="icon" href="/images/logo.svg" type="image/svg+xml">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">

    <style>
        /* Lets the ring percentage animate */
        @property --pct {
            syntax: "<number>";
            inherits: false;
            initial-value: 0;
        }

        .win-ring {
            --pct: 0;
            width: 190px;
            height: 190px;
            border-radius: 50%;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background:
                radial-gradient(circle, #fff 0 61%, transparent 62%),
                conic-gradient(var(--success) calc(var(--pct) * 1%), #f1e9f4 0);
            transition: --pct 1s ease;
        }

        .win-ring .pct {
            font-family: var(--font-display);
            font-size: 2.4rem;
            font-weight: 700;
            line-height: 1;
        }

        .progress {
            height: 14px;
            border-radius: 999px;
            background: #f1e9f4;
        }

        .progress-bar {
            border-radius: 999px;
            background: linear-gradient(90deg, #3fb47c, var(--success));
            font-size: .7rem;
            font-weight: 700;
            transition: width 1s ease;
        }
    </style>
</head>
<body>
    <div id="siteNav"></div>
    <script src="/js/nav.js"></script>

    <main class="container pb-5">
        <header class="page-header d-flex flex-wrap align-items-center gap-3 fade-up">
            <span id="playerAvatar"></span>
            <div>
                <span class="eyebrow"><i class="bi bi-bar-chart-fill"></i>Player statistics</span>
                <h1 class="page-title mb-0" id="playerName">Loading...</h1>
            </div>
        </header>

        <!-- Error Message -->
        <div id="errorMessage" class="alert alert-danger d-none rounded-4"></div>

        <!-- Statistics Section -->
        <div id="statsContent" class="d-none">
            <div class="row g-4">
                <div class="col-lg-4 fade-up delay-1">
                    <div class="so-card h-100 text-center">
                        <h2 class="so-card-title justify-content-center"><i class="bi bi-bullseye"></i>Win rate</h2>
                        <div class="win-ring" id="winRing">
                            <span class="pct" id="winPercentage">0%</span>
                            <span class="text-secondary small">of games won</span>
                        </div>
                    </div>
                </div>

                <div class="col-lg-8">
                    <div class="row g-4">
                        <div class="col-sm-6 fade-up delay-1">
                            <div class="stat-tile tile-success">
                                <span class="tile-icon"><i class="bi bi-trophy-fill"></i></span>
                                <div class="label">Wins</div>
                                <div class="value" id="wins">0</div>
                            </div>
                        </div>
                        <div class="col-sm-6 fade-up delay-2">
                            <div class="stat-tile tile-danger">
                                <span class="tile-icon"><i class="bi bi-x-octagon-fill"></i></span>
                                <div class="label">Losses</div>
                                <div class="value" id="losses">0</div>
                            </div>
                        </div>
                        <div class="col-sm-6 fade-up delay-3">
                            <div class="stat-tile tile-brand">
                                <span class="tile-icon"><i class="bi bi-suit-spade-fill"></i></span>
                                <div class="label">Total games played</div>
                                <div class="value" id="totalGames">0</div>
                            </div>
                        </div>
                        <div class="col-sm-6 fade-up delay-4">
                            <div class="stat-tile tile-gold">
                                <span class="tile-icon"><i class="bi bi-lightning-charge-fill"></i></span>
                                <div class="label">Win / loss ratio</div>
                                <div class="value" id="ratio">0</div>
                            </div>
                        </div>
                    </div>

                    <!-- Win Percentage Bar -->
                    <div class="so-card mt-4 fade-up delay-3">
                        <div class="d-flex justify-content-between mb-2">
                            <strong>Win rate</strong>
                            <span class="text-secondary small">Wins compared to all games</span>
                        </div>
                        <div class="progress" role="progressbar" aria-label="Win rate">
                            <div id="winProgress" class="progress-bar" style="width: 0%;"
                                 aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">0%</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Back Button -->
        <div class="d-flex flex-wrap gap-2 justify-content-center mt-5">
            <a id="backLink" href="/home.html" class="btn btn-light-soft">
                <i class="bi bi-house-door-fill"></i>Back to Home
            </a>
            <a id="toLeaderboard" href="/leaderboard.html" class="btn btn-primary">
                <i class="bi bi-trophy-fill"></i>See the leaderboard
            </a>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container d-flex flex-wrap justify-content-between gap-2">
            <span>&copy; Stack Overflow Chips &middot; Virtual chips only, no real-money gambling.</span>
            <span class="suits" aria-hidden="true">♠ ♥ ♣ ♦</span>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- ST-01 JavaScript -->
    <script>
        // The signed-in player (filled in once nav.js asks the server)
        let username = null;

        // Load player statistics from MongoDB through the server
        async function loadStats() {

            if (!username) {
                showError("Please log in to view your statistics.");
                return;
            }

            try {
                let response = await fetch("/stats/" + encodeURIComponent(username));

                if (!response.ok) {
                    throw new Error("Unable to load player statistics.");
                }

                let stats = await response.json();

                document.getElementById("playerName").textContent = stats.username;
                document.getElementById("playerAvatar").innerHTML = SOP.avatarHtml(stats.username, "avatar-lg");
                document.getElementById("wins").textContent = stats.wins;
                document.getElementById("losses").textContent = stats.losses;
                document.getElementById("winPercentage").textContent = stats.winPercentage + "%";
                document.getElementById("totalGames").textContent = stats.totalGames;
                document.getElementById("ratio").textContent =
                    stats.losses > 0 ? (stats.wins / stats.losses).toFixed(2) : String(stats.wins);

                // Show the statistics section, then animate the ring and bar
                document.getElementById("statsContent").classList.remove("d-none");

                requestAnimationFrame(function () {
                    let progress = document.getElementById("winProgress");
                    progress.style.width = stats.winPercentage + "%";
                    progress.textContent = stats.winPercentage + "%";
                    progress.setAttribute("aria-valuenow", stats.winPercentage);
                    document.getElementById("winRing").style.setProperty("--pct", stats.winPercentage);
                });

            } catch (error) {
                showError(error.message);
            }
        }

        function showError(message) {
            document.getElementById("playerName").textContent = "Statistics unavailable";
            let errorBox = document.getElementById("errorMessage");
            errorBox.textContent = message;
            errorBox.classList.remove("d-none");
        }

        SOP.ready.then(function () {
            username = SOP.user;
            loadStats();
        });
    </script>
</body>
</html>
