<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Friends - Stack Overflow Poker</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Navigation bar -->
    <nav class="navbar navbar-expand-sm navbar-dark navbar-purple">
        <div class="container-fluid">
          <!-- Links -->
              <ul class="navbar-nav">
                <li class="nav-item">
                  <a class="nav-link" href="home.html"><span class="logo-placeholder">Logo</span></a>
                </li>
                <li class="nav-item">
                  <a class="nav-link mt-2" href="lobby.html">Lobby</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link mt-2" href="friends.html">Friends</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link mt-2" href="stats.html">Stats</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link mt-2" href="profile.html">Profile</a>
                </li>
              </ul>
        </div>
    </nav>

    <div class="container mt-5">
        <h1 class="text-center mb-4">
          Friends
        </h1>

        <div class="row g-4">

            <!-- Requests and Friends -->
            <div class="col-md-5">
                <div class="card shadow p-4 h-100">

                    <!-- Search Players -->
                    <div class="input-group mb-4">
                        <input type="text" name="txt_search" class="form-control" placeholder="Search players">
                        <button class="btn btn-primary">
                          Add Friend
                        </button>
                    </div>

                    <h3>Requests</h3>
                    <div id="requestsContainer" class="mb-4"></div>

                    <h3>Friends</h3>
                    <div id="friendsContainer"></div>
                </div>
            </div>

            <!-- Chat (not made yet) -->
            <div class="col-md-7">
                <div class="card placeholder-box p-4 h-100">
                    <h3>Chat</h3>
                    <p class="text-muted">
                      Messaging with friends is coming soon.
                    </p>
                    <div style="height: 150px;"></div>
                    <input type="text" class="form-control" placeholder="Type message" disabled>
                </div>
            </div>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // Loads the friend requests and the friends list
  // The lists are empty until friend requests are added to the database
  let lstRequests = [];
  let lstFriends = [];

  function readRequestData() {
      let output = "";

      if (lstRequests.length == 0) {
        output = "<p>No friend requests right now.</p>";
      }

      for (let i = 0; i < lstRequests.length; i++) {
        output += `
        <p class="fs-5">
          ${lstRequests[i]}
          <span class="float-end">
            <button class="btn btn-primary btn-sm">Accept</button>
            <button class="btn btn-secondary btn-sm">Decline</button>
          </span>
        </p>
        <hr>
        `;
      }

      document.getElementById("requestsContainer").innerHTML = output;
  }

  function readFriendData() {
      let output = "";

      if (lstFriends.length == 0) {
        output = "<p>You have not added any friends yet.</p>";
      }

      for (let i = 0; i < lstFriends.length; i++) {
        output += `
        <p class="fs-5">
          <a href="player.html?name=${lstFriends[i]}">${lstFriends[i]}</a>
        </p>
        <hr>
        `;
      }

      document.getElementById("friendsContainer").innerHTML = output;
  }

  readRequestData();
  readFriendData();
</script>
</body>
</html>
