<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poker Table - Stack Overflow Poker</title>
  <link rel="icon" href="/images/logo.svg" type="image/svg+xml">

  <!-- Absolute paths: this page is also served at /table/:tableId -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/table.css">
</head>
<body>
  <div id="siteNav"></div>
  <script src="/js/nav.js"></script>

  <main class="container-xl pb-5">
    <header class="table-header fade-up">
      <h1 class="room-name" id="roomName">Poker Table</h1>
      <span class="pill" id="anteText">Ante -</span>
      <span class="pill pill-muted room-detail" id="limitsText">-</span>
      <button type="button" class="btn btn-danger-soft leave-button" id="leaveButton">
        <i class="bi bi-box-arrow-left"></i>Leave table
      </button>
    </header>

    <div id="notice" class="notice" role="status" aria-live="polite"></div>

    <div class="table-info fade-up delay-1">
      <span id="playerCount">Waiting for table information...</span>
      <div class="table-actions">
        <button type="button" class="btn btn-primary" id="joinButton" hidden>
          <i class="bi bi-box-arrow-in-right"></i>Join this table
        </button>
        <button type="button" class="btn btn-light-soft" id="inviteButton" hidden>
          <i class="bi bi-link-45deg"></i>Copy invite link
        </button>
        <button type="button" class="btn btn-sm btn-light-soft" id="refreshButton">
          <i class="bi bi-arrow-clockwise"></i>Refresh players
        </button>
      </div>
    </div>

    <div class="row g-4">
      <div class="col-lg-9">
        <section class="table-area fade-up delay-1" aria-label="Poker table and player seats">
          <div class="table-rail" aria-hidden="true">
            <div class="table-felt">
              <img class="felt-logo" src="/images/logo.svg" alt="">
            </div>
          </div>
          <div class="table-center">
            <div class="pot">
              <span class="chip-stack" aria-hidden="true"><i></i><i></i><i></i></span>
              Pot: --
            </div>
            <div class="street">Waiting</div>
            <div class="status" id="tableStatus">No hand in progress</div>
          </div>
          <div class="seats" id="seats"></div>
        </section>
      </div>

      <aside class="col-lg-3 d-flex flex-column gap-4">
        <section class="so-card chat-panel fade-up delay-2" aria-label="Table chat">
          <h2 class="so-card-title mb-2"><i class="bi bi-chat-dots-fill"></i>Table chat</h2>
          <div class="chat-messages">
            <div class="empty-state p-0">
              <i class="bi bi-chat-square-heart"></i>
              Chat will be available when the game is connected.
            </div>
          </div>
          <input class="form-control" type="text" placeholder="Type message" disabled aria-label="Table chat unavailable">
        </section>
        <section class="ad-slot fade-up delay-3" aria-label="Advertisement placeholder">
          <i class="bi bi-badge-ad"></i>
          <strong>ADVERTISEMENT</strong>
          <span class="small">Shown every 5 minutes</span>
        </section>
      </aside>
    </div>

    <section class="action-panel fade-up delay-2" aria-label="Poker actions">
      <div class="turn-timer" style="--progress: 0;" aria-hidden="true">--</div>
      <div>
        <div class="turn-message">Turn timer: --</div>
        <div class="game-note">Poker gameplay has not been connected yet.</div>
      </div>
      <div class="action-buttons">
        <button class="game-button fold" type="button" disabled><i class="bi bi-x-lg me-1"></i>Fold</button>
        <button class="game-button" type="button" disabled>Check</button>
        <button class="game-button" type="button" disabled>Call</button>
        <button class="game-button raise" type="button" disabled><i class="bi bi-arrow-up me-1"></i>Raise / Complete</button>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // LT-03: The table view uses the same MongoDB record as the lobby and Create Table.
    const params = new URLSearchParams(window.location.search);
    const pathMatch = window.location.pathname.match(/^\/table\/([^/]+)/);
    const tableId = params.get("tableId") || params.get("id") ||
                    (pathMatch ? decodeURIComponent(pathMatch[1]) : null) ||
                    sessionStorage.getItem("currentTableId");
    let username = params.get("username") || sessionStorage.getItem("currentUsername") || SOP.user || "";
    let currentTable = null;
    // What each seat showed last time, so polling only redraws when something changed
    let lastSeatKey = "";
    let lastSeatNames = [];

    const seatPositions = {
      2: ["top-center", "bottom-center"],
      3: ["top-left", "top-right", "bottom-center"],
      4: ["top-left", "top-right", "bottom-left", "bottom-right"],
      5: ["top-left", "top-center", "top-right", "bottom-left", "bottom-right"],
      6: ["top-left", "top-center", "top-right", "bottom-left", "bottom-center", "bottom-right"],
      7: ["top-left", "top-center", "top-right", "middle-left", "bottom-left", "bottom-center", "bottom-right"]
    };

    function showNotice(message) {
      const notice = document.getElementById("notice");
      notice.textContent = message;
      notice.classList.add("show");
    }

    function clearNotice() {
      const notice = document.getElementById("notice");
      notice.textContent = "";
      notice.classList.remove("show");
    }

    function showSeats(table) {
      const seats = document.getElementById("seats");

      const maxPlayers = Math.min(7, Math.max(2, Number(table.maxPlayers) || 7));
      const positions = seatPositions[maxPlayers];
      const players = Array.isArray(table.players) ? table.players.slice(0, maxPlayers) : [];
      const seatNames = Array(maxPlayers).fill(null);

      // Display the current user's seat near the bottom whenever they have joined.
      if (username && players.includes(username)) {
        const preferred = positions.indexOf("bottom-center") >= 0 ? positions.indexOf("bottom-center") : positions.indexOf("bottom-left");
        seatNames[preferred >= 0 ? preferred : maxPlayers - 1] = username;
      }
      let nextSeat = 0;
      for (const name of players) {
        if (username && name === username) continue;
        while (nextSeat < maxPlayers && seatNames[nextSeat] !== null) nextSeat++;
        if (nextSeat < maxPlayers) seatNames[nextSeat] = name;
      }

      // Nothing changed since the last check: keep the seats as they are (no flicker)
      const seatKey = maxPlayers + "|" + username + "|" + seatNames.join(",");
      if (seatKey === lastSeatKey) return;

      const firstDraw = lastSeatKey === "";
      const previousNames = lastSeatNames;
      lastSeatKey = seatKey;
      lastSeatNames = seatNames;
      seats.replaceChildren();

      for (let i = 0; i < maxPlayers; i++) {
        const seat = document.createElement("div");
        seat.className = "seat " + positions[i];
        const name = seatNames[i];

        // Animate every seat on the first draw; after that, only seats that changed
        if (firstDraw) {
          seat.style.animationDelay = (i * 0.04) + "s";
        } else if (previousNames.length === maxPlayers && previousNames[i] === name) {
          seat.style.animation = "none";
        }

        const avatar = document.createElement("span");
        const text = document.createElement("span");
        text.className = "seat-text";
        const title = document.createElement("strong");
        const note = document.createElement("span");
        note.className = "seat-note";

        if (!name) {
          seat.classList.add("empty");
          avatar.className = "avatar";
          avatar.innerHTML = '<i class="bi bi-plus-lg"></i>';
          title.textContent = "Empty";
          note.textContent = "Open seat";
        } else {
          avatar.className = "avatar " + SOP.avatarTone(name);
          avatar.textContent = name.charAt(0);
          title.textContent = name;
          note.textContent = "Waiting";
          if (name === username) seat.classList.add("yours");
        }

        text.append(title, note);
        seat.append(avatar, text);

        if (name) {
          const cards = document.createElement("span");
          cards.className = "cards";
          cards.setAttribute("aria-hidden", "true");
          cards.innerHTML = "<span></span><span></span>";
          seat.appendChild(cards);
        }

        seats.appendChild(seat);
      }
    }

    function showTable(table) {
      currentTable = table;
      document.getElementById("roomName").textContent = table.name || "Poker Table";
      document.title = (table.name || "Poker Table") + " - Stack Overflow Poker";
      const anteParts = String(table.ante || "").split("/").map(part => part.trim()).filter(Boolean);
      document.getElementById("anteText").innerHTML = '<i class="bi bi-coin"></i>Ante ' + SOP.escapeHtml(anteParts[0] || "-");
      const limits = anteParts.length >= 4 ? anteParts[2] + "-" + anteParts[3] :
                     anteParts.length >= 3 ? anteParts[1] + "-" + anteParts[2] : "-";
      document.getElementById("limitsText").textContent = "Limits " + limits;

      const players = Array.isArray(table.players) ? table.players : [];
      const count = players.length;
      const maxPlayers = Number(table.maxPlayers) || 7;
      const privacy = table.privacy === "private" ? "Private" : "Public";
      document.getElementById("playerCount").innerHTML =
        '<i class="bi ' + (privacy === "Private" ? "bi-lock-fill" : "bi-globe2") + ' me-1"></i>' +
        privacy + " table · " + count + "/" + maxPlayers + " players · Bots: " + SOP.escapeHtml(table.bots || "off");
      document.getElementById("tableStatus").textContent =
        table.status === "playing" ? "Game in progress (game controls not connected)" : "Waiting for players";
      showSeats(table);

      const joinButton = document.getElementById("joinButton");
      const alreadyJoined = username && players.includes(username);
      joinButton.hidden = !!alreadyJoined || table.status !== "waiting" || count >= maxPlayers;
      document.getElementById("inviteButton").hidden = table.privacy !== "private";
    }

    async function loadTable(silent = false) {
      if (!tableId) {
        showNotice("No table selected. Create or join a table from the lobby.");
        document.getElementById("playerCount").textContent = "No table selected";
        showSeats({maxPlayers: 7, players: []});
        return;
      }

      try {
        const response = await fetch("/api/tables/" + encodeURIComponent(tableId), { cache: "no-store" });
        const result = await response.json();
        if (!response.ok) {
          throw new Error(result.msg || "Could not load this table");
        }
        if (!silent) clearNotice();
        sessionStorage.setItem("currentTableId", tableId);
        showTable(result);
      } catch (error) {
        if (!silent || !currentTable) showNotice(error.message || "Could not load table. Check your connection.");
        if (!currentTable) {
          document.getElementById("playerCount").textContent = "Table unavailable";
          document.getElementById("joinButton").hidden = true;
          document.getElementById("inviteButton").hidden = true;
          showSeats({maxPlayers: 7, players: []});
        }
      }
    }

    async function joinCurrentTable() {
      if (!tableId || !currentTable) return;
      // Signed-in players join as themselves; guests are asked for a name.
      const name = SOP.user || prompt("Enter your username to join this table:", username);
      if (!name || !name.trim()) return;
      const joinButton = document.getElementById("joinButton");
      joinButton.disabled = true;
      try {
        const response = await fetch("/api/tables/join", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ tableId: tableId, username: name.trim() })
        });
        const result = await response.json();
        if (!response.ok) {
          showNotice(result.msg || "Unable to join table");
          return;
        }
        username = name.trim();
        sessionStorage.setItem("currentUsername", username);
        clearNotice();
        SOP.toast("You joined " + (currentTable.name || "the table") + "!", "success");
        // Update immediately using the returned saved table, then refresh from MongoDB.
        if (result.table) showTable(result.table);
        await loadTable(true);
      } catch (error) {
        showNotice("Could not join this table. Check your connection.");
      } finally {
        joinButton.disabled = false;
      }
    }

    async function copyInviteLink() {
      if (!tableId) return;
      const link = new URL("/table.html?tableId=" + encodeURIComponent(tableId), location.href).href;
      try {
        await navigator.clipboard.writeText(link);
        SOP.toast("Invite link copied. Anyone with this link can open the table and join.", "success");
      } catch (error) {
        prompt("Copy this invite link:", link);
      }
    }

    document.getElementById("joinButton").addEventListener("click", joinCurrentTable);
    document.getElementById("inviteButton").addEventListener("click", copyInviteLink);
    document.getElementById("refreshButton").addEventListener("click", () => loadTable());
    document.getElementById("leaveButton").addEventListener("click", function () {
      if (confirm("Return to the lobby? Your seat stays reserved until a leave-table feature is added.")) {
        location.href = SOP.withUser("/lobby.html");
      }
    });

    loadTable();
    // Lightweight polling lets another player appear without having to reload the page.
    setInterval(() => { if (!document.hidden) loadTable(true); }, 5000);
  </script>
</body>
</html>
