<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Table - Stack Overflow Poker</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Navigation bar -->
    <nav class="navbar navbar-expand-sm navbar-dark navbar-purple">
        <div class="container-fluid">
          <!-- Links -->
              <ul class="navbar-nav">
                <li class="nav-item">
                  <a class="nav-link" href="home.html"><span class="logo-placeholder">Logo</span></a>
                </li>
                <li class="nav-item">
                  <a class="nav-link mt-2" href="lobby.html">Lobby</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link mt-2" href="friends.html">Friends</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link mt-2" href="stats.html">Stats</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link mt-2" href="profile.html">Profile</a>
                </li>
              </ul>
        </div>
    </nav>

    <div class="container mt-5">
        <h1 class="text-center mb-4">
          Table
        </h1>
        <button id="leaveButton">Leave Table</button>
    </div>

<script>
  const tableId = window.location.pathname.split("/").pop();

  document.getElementById("leaveButton").onclick = async function() {
    const username = sessionStorage.getItem("username");

    if (!username) {
        alert("Could not identify your player.");
        return;
    }

    try {
        const response = await fetch("/api/tables/leave", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                tableId: tableId,
                username: username
            })
        });

        const result = await response.json();
        alert(result.msg);

        if (response.ok) {
            window.location.href = "/lobby.html";
        }
    } catch (error) {
        alert("Could not leave table.");
    }
};

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
