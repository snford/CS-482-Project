<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Player - Stack Overflow Poker</title>
    <link rel="icon" href="/images/logo.svg" type="image/svg+xml">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">

    <style>
        .player-hero { text-align: center; padding-top: 2.6rem; }
        .player-hero .avatar { margin-bottom: 1rem; }
        .dm-messages {
            height: 320px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: .6rem;
            padding: 1rem;
            background: var(--brand-50);
            border-radius: 12px;
        }
        .dm-messages .bubble { max-width: 70%; padding: .6rem .9rem; border-radius: 16px; font-size: .92rem; word-break: break-word; }
        .dm-messages .bubble.them { background: #f2eef5; color: #29212e; border-bottom-left-radius: 4px; }
        .dm-messages .bubble.me { align-self: flex-end; color: #fff; background: linear-gradient(135deg, #cf55cf, var(--brand-700)); border-bottom-right-radius: 4px; }
        .dm-empty { margin: auto; color: var(--ink-muted); font-size: .9rem; }
    </style>
</head>
<body>
    <div id="siteNav"></div>
    <script src="/js/nav.js"></script>

    <main class="container pb-5">
        <div class="row justify-content-center">
            <div class="col-lg-7">
                <a id="backLink" href="/friends.html" class="d-inline-block mt-4 small fw-semibold text-decoration-none">
                    <i class="bi bi-arrow-left"></i> Back to friends
                </a>

                <div class="hero-card player-hero mt-3 fade-up">
                    <div class="hero-suits" aria-hidden="true"><span>♣</span><span>♦</span><span>♠</span></div>
                    <div id="playerAvatar"></div>
                    <h1 class="h2 mb-1" id="playerName">Player</h1>
                    <p class="mb-0" id="playerTagline">Stack Overflow Poker player</p>
                </div>

                <div class="so-card fade-up delay-1" style="margin-top: -1rem; position: relative;">
                    <div class="row g-3 text-center mb-4">
                        <div class="col-4">
                            <div class="stat-tile tile-success"><div class="label">Wins</div><div class="value" id="pWins">–</div></div>
                        </div>
                        <div class="col-4">
                            <div class="stat-tile tile-danger"><div class="label">Losses</div><div class="value" id="pLosses">–</div></div>
                        </div>
                        <div class="col-4">
                            <div class="stat-tile"><div class="label">Win %</div><div class="value" id="pRate">–</div></div>
                        </div>
                    </div>
                    <!-- UP-02: Player's virtual chips -->
                    <div class="text-center mb-4">

                        <span class="pill">
                            <i class="bi bi-coin"></i>
                            Chips:
                            <strong id="pChips">–</strong>
                        </span>

                    </div>

                    <div class="d-flex flex-wrap gap-2 justify-content-center" id="playerActions">
                        <!-- SF-01: Add friend uses the same form as the Friends page -->
                        <form action="/addfriend" method="post" id="addFriendForm">
                            <input type="hidden" name="txt_to" id="txt_to">
                            <button type="submit" class="btn btn-primary" id="addFriendButton">
                                <i class="bi bi-person-plus-fill"></i>Add Friend
                            </button>
                        </form>
                        <span class="pill pill-success align-self-center" id="friendsBadge" hidden>
                            <i class="bi bi-check-circle-fill"></i>Friends
                        </span>
                        <!-- SF-04: Remove friend (only shown if you're friends) -->
                        <form action="/removefriend" method="post" id="removeFriendForm" hidden>
                            <input type="hidden" name="txt_friend" id="txt_friend">
                            <button type="submit" class="btn btn-danger-soft">
                                <i class="bi bi-person-dash-fill"></i>Remove Friend
                            </button>
                        </form>
                        <button type="button" class="btn btn-primary" id="messageButton">
                            <i class="bi bi-chat-dots-fill"></i>Message
                        </button>
                        <a id="reportLink" href="/report.html" class="btn btn-danger-soft">
                            <i class="bi bi-flag-fill"></i>Report Player
                        </a>
                    </div>
                </div>
                <div class="so-card mt-4 fade-up" id="dmSection" hidden>
                <h2 class="so-card-title">
                    <i class="bi bi-chat-dots-fill"></i>Message <span id="dmName"></span>
                </h2>
                <div id="dmMessages" class="dm-messages"></div>
                <div class="input-group mt-3">
                    <input id="dmInput" type="text" class="form-control" maxlength="500" placeholder="Type a message">
                    <button id="dmSend" class="btn btn-primary" type="button" aria-label="Send">
                        <i class="bi bi-send-fill"></i>
                    </button>
                </div>
            </div>
            </div>
        </div>
        
    </main>

    <footer class="site-footer">
        <div class="container d-flex flex-wrap justify-content-between gap-2">
            <span>&copy; Stack Overflow Chips &middot; Virtual chips only, no real-money gambling.</span>
            <span class="suits" aria-hidden="true">♠ ♥ ♣ ♦</span>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const playerName = new URLSearchParams(window.location.search).get("name");
        let me = null;

        async function loadPlayer() {
            me = SOP.user;

            if (!playerName) {
                document.getElementById("playerName").textContent = "No player selected";
                document.getElementById("playerActions").hidden = true;
                return;
            }

            document.getElementById("playerName").textContent = playerName;
            document.getElementById("playerAvatar").innerHTML = SOP.avatarHtml(playerName, "avatar-xl");
            document.getElementById("reportLink").href = "/report.html?name=" + encodeURIComponent(playerName);
            document.title = playerName + " - Stack Overflow Poker";

            // Add Friend only makes sense for someone else, while signed in
            const addForm = document.getElementById("addFriendForm");
            if (!me || me === playerName) {
                addForm.hidden = true;
            } else {
                document.getElementById("txt_to").value = playerName;
            }

            // UP-02: Load the selected player's public profile
            try {

                const response = await fetch(
                    "/api/players/" +
                    encodeURIComponent(playerName) +
                    "/profile"
                );

                // Player does not exist
                if (response.status === 404) {

                    document.getElementById("playerTagline").textContent =
                        "This player doesn't exist.";

                    document.getElementById("playerActions").hidden = true;

                    return;
                }

                if (!response.ok) {
                    throw new Error("Unable to load player profile.");
                }

                // Convert the server response to JavaScript data
                const profile = await response.json();

                // Display the player's actual saved username
                document.getElementById("playerName").textContent =
                    profile.username;

                // Display statistics
                document.getElementById("pWins").textContent =
                    profile.wins;

                document.getElementById("pLosses").textContent =
                    profile.losses;

                document.getElementById("pRate").textContent =
                    profile.winPercentage + "%";

                // Display chips
                document.getElementById("pChips").textContent =
                    profile.chips.toLocaleString();

                // Display saved avatar
                const avatarSymbols = {
                    spade: "♠",
                    diamond: "♦",
                    club: "♣",
                    heart: "♥",
                    star: "★"
                };

                const avatarSymbol =
                    avatarSymbols[profile.avatar] || "♠";

                const avatarDisplay =
                    document.getElementById("playerAvatar");

                avatarDisplay.replaceChildren();

                const avatarElement =
                    document.createElement("span");

                avatarElement.className =
                    "avatar avatar-xl tone-1";

                avatarElement.textContent = avatarSymbol;

                avatarDisplay.appendChild(avatarElement);

            } catch (error) {

                document.getElementById("playerTagline").textContent =
                    error.message;

                document.getElementById("playerActions").hidden = true;

            }

            // Show a badge instead of the button if you're already friends
            if (me && me !== playerName) {
                if (SOP.me.friends.includes(playerName)) {
                    addForm.hidden = true;
                    document.getElementById("friendsBadge").hidden = false;
                    document.getElementById("txt_friend").value = playerName;
                    document.getElementById("removeFriendForm").hidden = false;
                } else if (SOP.me.friendRequests.includes(playerName)) {
                    document.getElementById("addFriendButton").innerHTML =
                        '<i class="bi bi-person-check-fill"></i>Accept their request';
                }
            }
        }

        // SF-04: ask before removing a friend
        document.getElementById("removeFriendForm").addEventListener("submit", function (event) {
            if (!confirm("Remove " + playerName + " from your friends? You'll both be removed from each other's lists.")) {
                event.preventDefault();
            }
        });

        SOP.ready.then(loadPlayer);

        let activeFriend = null;

        (function () {
            const PAGE_SIZE = 30;
            const target = (playerName || "").trim();

            const section = document.getElementById("dmSection");
            const box = document.getElementById("dmMessages");
            const input = document.getElementById("dmInput");
            const messageButton = document.getElementById("messageButton");

            let oldest = null, newest = 0, hasMore = true, loadingOlder = false;

            function makeBubble(msg) {
                const el = document.createElement("div");
                const mine = msg.from === SOP.me.username;
                el.className = "bubble " + (mine ? "me" : "them");
                const time = new Date(msg.sentAt).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
                el.textContent = mine ? msg.text + " : " + time : time + " : " + msg.text;
                return el;
            }

            async function fetchMessages(before) {
                let url = "/messages/" + encodeURIComponent(target) + "?limit=" + PAGE_SIZE;
                if (before) url += "&before=" + encodeURIComponent(before);
                const r = await fetch(url, { cache: "no-store" });
                return r.ok ? r.json() : [];
            }

            async function loadLatest() {
                const messages = await fetchMessages();
                box.replaceChildren();
                if (messages.length === 0) {
                    box.innerHTML = '<div class="dm-empty">No messages yet. Say hi!</div>';
                    return;
                }
                for (const m of messages) box.appendChild(makeBubble(m));
                oldest = messages[0]._id;
                newest = new Date(messages[messages.length - 1].sentAt).getTime();
                hasMore = messages.length === PAGE_SIZE;
                box.scrollTop = box.scrollHeight;
            }

            async function refresh() {
                const messages = await fetchMessages();
                const fresh = messages.filter(m => new Date(m.sentAt).getTime() > newest);
                if (fresh.length === 0) return;

                const empty = box.querySelector(".dm-empty");
                if (empty) empty.remove();
                if (!oldest) oldest = fresh[0]._id;

                const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
                const sentByMe = fresh.some(m => m.from === SOP.me.username);
                for (const m of fresh) box.appendChild(makeBubble(m));
                newest = new Date(fresh[fresh.length - 1].sentAt).getTime();
                if (nearBottom || sentByMe) box.scrollTop = box.scrollHeight;
            }

            async function loadOlder() {
                if (loadingOlder || !hasMore || !oldest) return;
                loadingOlder = true;
                try {
                    const older = await fetchMessages(oldest);
                    hasMore = older.length === PAGE_SIZE;
                    if (older.length === 0) return;
                    const before = box.scrollHeight;
                    const frag = document.createDocumentFragment();
                    for (const m of older) frag.appendChild(makeBubble(m));
                    box.insertBefore(frag, box.firstChild);
                    box.scrollTop += box.scrollHeight - before;
                    oldest = older[0]._id;
                } finally {
                    loadingOlder = false;
                }
            }

            async function send() {
                const text = input.value.trim();
                if (!text) return;

                const r = await fetch("/messages/send", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ to: target, text: text })
                });
                if (!r.ok) {
                    let msg = "Could not send message.";
                    try { msg = (await r.json()).msg || msg; } catch (e) { /* keep default */ }
                    SOP.toast(msg, "error");
                    return;
                }
                input.value = "";
                await refresh();
            }

            SOP.ready.then(function () {
                // Only for signed-in players viewing someone else's profile
                if (!SOP.user || !target || target === SOP.me.username) {
                    messageButton.hidden = true;
                    return;
                }

                messageButton.addEventListener("click", function () {
                    section.hidden = false;
                    section.scrollIntoView({ behavior: "smooth", block: "center" });
                    input.focus();
                });

                section.hidden = true;           // show the chat right away
                document.getElementById("dmName").textContent = target;
                activeFriend = target;
                MsgNotify.clear(target);

                loadLatest();

                box.addEventListener("scroll", function () { if (box.scrollTop < 40) loadOlder(); });
                document.getElementById("dmSend").addEventListener("click", send);
                input.addEventListener("keydown", function (e) { if (e.key === "Enter") send(); });

                window.addEventListener("new-message", function (e) {
                    if (e.detail.friend === target) refresh();
                });
                document.addEventListener("visibilitychange", function () {
                    if (!document.hidden) MsgNotify.clear(target);
                });
            });
        })();
    </script>
</body>
</html>
