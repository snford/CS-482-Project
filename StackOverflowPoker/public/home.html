<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Home - Stack Overflow Poker</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Navigation bar -->
    <nav class="navbar navbar-expand-sm navbar-dark navbar-purple">
        <div class="container-fluid">
          <!-- Links -->
              <ul class="navbar-nav">
                <li class="nav-item">
                  <a class="nav-link" href="home.html"><span class="logo-placeholder">Logo</span></a>
                </li>
                <li class="nav-item">
                  <a class="nav-link mt-2" href="lobby.html">Lobby</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link mt-2" href="friends.html" id="friendsLink">Friends</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link mt-2" href="stats.html" id="statsLink">Stats</a>
                </li>
                <!-- ST-02: Leaderboard -->
                <li class="nav-item">
                  <a class="nav-link mt-2"
                    href="leaderboard.html"
                    id="leaderboardLink">
                    Leaderboard
                  </a>
                </li>
                <li class="nav-item">
                  <a class="nav-link mt-2" href="profile.html">Profile</a>
                </li>
              </ul>
        </div>
    </nav>

    <div class="container mt-5">
        <h1 class="text-center mb-4">
          Home
        </h1>

    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // Keeps the logged in username when going to the friends page
  // (temporary until Google sign in is added)
  let params = new URLSearchParams(window.location.search);
  let username = params.get("username");

  if (username != null) {
    document.getElementById("friendsLink").href =
        "friends.html?username=" + encodeURIComponent(username);

    // ST-01: Player Statistics navigation
    document.getElementById("statsLink").href =
        "stats.html?username=" + encodeURIComponent(username);

    // ST-02: Leaderboard navigation
    document.getElementById("leaderboardLink").href =
        "leaderboard.html?username=" + encodeURIComponent(username);

  }
</script>
</body>
</html>
