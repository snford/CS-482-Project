<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Table - Stack Overflow Poker</title>
    <link rel="icon" href="/images/logo.svg" type="image/svg+xml">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/createTable.css">
</head>
<body>
    <div id="siteNav"></div>
    <script src="/js/nav.js"></script>

    <main class="container pb-5">
        <header class="page-header fade-up">
            <a id="backToLobby" href="/lobby.html" class="text-decoration-none small fw-semibold">
                <i class="bi bi-arrow-left"></i> Back to lobby
            </a>
            <h1 class="page-title">Create a table</h1>
            <p class="page-subtitle">Set the stakes, invite your friends, and deal the first hand.</p>
        </header>

        <div class="row g-4">
            <!-- Form -->
            <div class="col-lg-7 fade-up delay-1">
                <section class="so-card create-table">
                    <form id="createTableForm" novalidate>
                        <div class="mb-4">
                            <label class="form-label" for="tableName">Table name</label>
                            <div class="input-icon">
                                <i class="bi bi-suit-spade"></i>
                                <input class="form-control form-control-lg" type="text" id="tableName" name="tableName"
                                       placeholder="Friday night stud" maxlength="40" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label d-block">Visibility</label>
                            <div class="button-group" id="visibility-options" role="group" aria-label="Visibility">
                                <button type="button" class="option-button selected" data-value="public">
                                    <i class="bi bi-globe2"></i>Public
                                </button>
                                <button type="button" class="option-button" data-value="private">
                                    <i class="bi bi-lock-fill"></i>Private
                                </button>
                            </div>
                            <p class="form-hint mb-0" id="visibilityHint">Anyone can find and join this table from the lobby.</p>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-md-7">
                                <label class="form-label" for="ante">Ante / bring-in / small bet / big bet</label>
                                <div class="input-icon">
                                    <i class="bi bi-coin"></i>
                                    <input class="form-control" type="text" id="ante" name="ante"
                                           placeholder="5 / 10 / 20 / 40" value="5 / 10 / 20 / 40" required>
                                </div>
                            </div>
                            <div class="col-md-5">
                                <label class="form-label" for="max-players">Max players: <span id="maxPlayersLabel">7</span></label>
                                <input class="form-range mt-2" type="range" id="max-players" name="maxPlayers"
                                       min="2" max="7" step="1" value="7" required>
                                <div class="d-flex justify-content-between form-hint mt-0"><span>2</span><span>7</span></div>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label d-block">Fill empty seats with bots</label>
                            <div class="button-group" id="bot-options" role="group" aria-label="Bot difficulty">
                                <button type="button" class="option-button selected" data-value="off">Off</button>
                                <button type="button" class="option-button" data-value="easy">Easy</button>
                                <button type="button" class="option-button" data-value="medium">Medium</button>
                                <button type="button" class="option-button" data-value="hard">Hard</button>
                            </div>
                        </div>

                        <div class="form-actions d-flex flex-wrap gap-2 justify-content-end">
                            <a href="/lobby.html" class="btn btn-light-soft" id="cancelLink">Cancel</a>
                            <button type="submit" class="btn btn-primary btn-lg" id="create-button">
                                <i class="bi bi-plus-circle-fill"></i>Create table
                            </button>
                        </div>
                    </form>
                    <p id="createMessage" class="mt-3 mb-0 text-danger small" role="status"></p>
                </section>
            </div>

            <!-- Live preview -->
            <div class="col-lg-5 fade-up delay-2">
                <aside class="so-card position-sticky" style="top: 96px;">
                    <h2 class="so-card-title"><i class="bi bi-eye-fill"></i>Preview</h2>
                    <div class="preview-felt" id="previewFelt">
                        <div>
                            <div class="preview-name" id="previewName">Your table</div>
                            <span class="pill pill-dark mt-2" id="previewPrivacy"><i class="bi bi-globe2"></i>Public</span>
                        </div>
                    </div>
                    <div class="preview-stats">
                        <div><span>Ante</span><strong id="previewAnte">5</strong></div>
                        <div><span>Limits</span><strong id="previewLimits">20 / 40</strong></div>
                        <div><span>Seats</span><strong id="previewSeats">7</strong></div>
                        <div><span>Bots</span><strong id="previewBots">Off</strong></div>
                    </div>
                </aside>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container d-flex flex-wrap justify-content-between gap-2">
            <span>&copy; Stack Overflow Chips &middot; Virtual chips only, no real-money gambling.</span>
            <span class="suits" aria-hidden="true">♠ ♥ ♣ ♦</span>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    // Segmented option buttons (one selected per group)
    function setupGroup(selector) {
        const buttons = document.querySelectorAll(selector + " .option-button");
        buttons.forEach(button => {
            button.addEventListener("click", () => {
                buttons.forEach(option => option.classList.remove("selected"));
                button.classList.add("selected");
                updatePreview();
            });
        });
    }

    setupGroup("#visibility-options");
    setupGroup("#bot-options");

    // ---- Live preview ----
    const seatSpots = [
        [50, 8], [84, 22], [92, 62], [70, 90], [30, 90], [8, 62], [16, 22]
    ];
    const felt = document.getElementById("previewFelt");
    const seatDots = seatSpots.map(([left, top]) => {
        const dot = document.createElement("span");
        dot.className = "preview-seat";
        dot.style.left = "calc(" + left + "% - 11px)";
        dot.style.top = "calc(" + top + "% - 11px)";
        felt.appendChild(dot);
        return dot;
    });

    function updatePreview() {
        const name = document.getElementById("tableName").value.trim();
        const seats = Number(document.getElementById("max-players").value);
        const privacy = document.querySelector("#visibility-options .selected").getAttribute("data-value");
        const bots = document.querySelector("#bot-options .selected").getAttribute("data-value");
        const parts = document.getElementById("ante").value.split("/").map(p => p.trim()).filter(Boolean);

        document.getElementById("previewName").textContent = name || "Your table";
        document.getElementById("maxPlayersLabel").textContent = seats;
        document.getElementById("previewSeats").textContent = seats;
        document.getElementById("previewBots").textContent = bots;
        document.getElementById("previewAnte").textContent = parts[0] || "-";
        document.getElementById("previewLimits").textContent =
            parts.length >= 4 ? parts[2] + " / " + parts[3] : "-";

        const privacyPill = document.getElementById("previewPrivacy");
        privacyPill.innerHTML = privacy === "private"
            ? '<i class="bi bi-lock-fill"></i>Private'
            : '<i class="bi bi-globe2"></i>Public';
        document.getElementById("visibilityHint").textContent = privacy === "private"
            ? "Hidden from the lobby. Share the invite link so friends can join."
            : "Anyone can find and join this table from the lobby.";

        seatDots.forEach((dot, index) => dot.classList.toggle("on", index < seats));
    }

    for (const id of ["tableName", "max-players", "ante"]) {
        document.getElementById(id).addEventListener("input", updatePreview);
    }
    updatePreview();

    // LT-03: create the table in MongoDB, then open it
    document.getElementById("createTableForm").onsubmit = async function(event) {
        event.preventDefault();

        const name = document.getElementById("tableName").value;
        const maxPlayers = document.getElementById("max-players").value;
        const ante = document.getElementById("ante").value;
        const privacy = document.querySelector("#visibility-options .selected").getAttribute("data-value");
        const bots = document.querySelector("#bot-options .selected").getAttribute("data-value");
        const message = document.getElementById("createMessage");
        const button = document.getElementById("create-button");

        if (!name.trim()) {
            message.textContent = "Give your table a name.";
            document.getElementById("tableName").focus();
            return;
        }

        message.textContent = "";
        button.disabled = true;

        try {
            const response = await fetch("/api/tables/create", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    name: name,
                    maxPlayers: maxPlayers,
                    privacy: privacy,
                    ante: ante,
                    bots: bots
                })
            });

            const result = await response.json();

            if (response.ok) {
                if (result.table && result.table._id) {
                    sessionStorage.setItem("currentTableId", result.table._id);

                    window.location.href = "/table.html?tableId=" +
                        encodeURIComponent(result.table._id);
                    return;
                }
                message.textContent = "Table created, but could not open it.";
            } else {
                message.textContent = result.msg || "Could not create table.";
            }
        } catch (error) {
            message.textContent = "Could not create table.";
        } finally {
            button.disabled = false;
        }
    };
    </script>
</body>
</html>
