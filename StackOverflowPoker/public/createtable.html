<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Create Table - Stack Overflow Poker</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/createTable.css">
</head>
<body>

    <!-- Navigation bar -->
    <nav class="navbar navbar-expand-sm navbar-dark navbar-purple">
        <div class="container-fluid">
          <!-- Links -->
              <ul class="navbar-nav">
                <li class="nav-item">
                  <a class="nav-link" href="home.html"><span class="logo-placeholder">Logo</span></a>
                </li>
                <li class="nav-item">
                  <a class="nav-link mt-2" href="lobby.html">Lobby</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link mt-2" href="friends.html">Friends</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link mt-2" href="stats.html">Stats</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link mt-2" href="profile.html">Profile</a>
                </li>
              </ul>
        </div>
    </nav>

    <!-- Main content -->
    <div class="container mt-5">
    <h1 class="text-center mb-4">Create Table</h1>

    <form id="createTableForm">

        <label for="tableName">Table Name:</label>
        <input type="text" id="tableName" class="form-control" required>

        <label for="maxPlayers" class="mt-3">Maximum Players:</label>
        <select id="maxPlayers" class="form-select">
            <option value="2">2</option>
            <option value="4">4</option>
            <option value="6" selected>6</option>
        </select>

        <label for="privacy" class="mt-3">Who Can Join:</label>
        <select id="privacy" class="form-select">
            <option value="public">Anyone</option>
            <option value="private">Invited Friends Only</option>
        </select>

        <button type="submit" class="btn btn-primary mt-3">
            Create Table
        </button>

    </form>

    <p id="createMessage" class="mt-3"></p>
›</div>

        <section class="create-table">
          <form id="createTableForm">
            <div class="form-group">
              <label for="tableName" >Table Name</label>
              <input 
              type="text"
              id="tableName"
              name="tableName"
              placeholder="Enter table name"
              maxlength="40" 
              required>
            </div>
            <div class="form-group">
                    <label>Visibility</label>

                    <div class="button-group" id="visibility-options">
                        <button
                            type="button"
                            class="option-button selected"
                            data-value="public">
                            Public
                        </button>

                        <button
                            type="button"
                            class="option-button"
                            data-value="private">
                            Private
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="ante">
                        Ante / bring-in / small bet / big bet
                    </label>

                    <input
                        type="text"
                        id="ante"
                        name="ante"
                        placeholder="5 / 10 / 20 / 40"
                        required>
                </div>
                <div class="form-group">
                    <label for="max-players">Max players (2-7)</label>

                    <input
                        type="number"
                        id="max-players"
                        name="maxPlayers"
                        min="2"
                        max="7"
                        value="7"
                        required>
                </div>
                <div class="form-group">
                    <label>Fill empty seats with bots</label>

                    <div class="button-group" id="bot-options">
                        <button
                            type="button"
                            class="option-button selected"
                            data-value="off"
                        >
                            Off
                        </button>

                        <button
                            type="button"
                            class="option-button"
                            data-value="easy"
                        >
                            Easy
                        </button>

                        <button
                            type="button"
                            class="option-button"
                            data-value="medium"
                        >
                            Medium
                        </button>

                        <button
                            type="button"
                            class="option-button"
                            data-value="hard"
                        >
                            Hard
                        </button>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="window.location.href='lobby.html';">
                        Cancel
                    </button>

                    <button type="submit"  class="btn btn-primary" id="create-button">
                        Create
                    </button>
                </div>

            </form>

        </section>


    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
 
<script>
    const visibilityButtons = document.querySelectorAll(
        "#visibility-options .option-button"
    );
    const botButtons = document.querySelectorAll(
        "#bot-options .option-button"
    );

    visibilityButtons.forEach(button => {
        button.addEventListener("click", () => {

            // Remove selected from all visibility buttons
            visibilityButtons.forEach(option => {
                option.classList.remove("selected");
            });
            
            // Select the clicked button
            button.classList.add("selected");
        });
    });

    botButtons.forEach(button => {
        button.addEventListener("click", () => {

            // Remove selected from all bot buttons
            botButtons.forEach(option => {
                option.classList.remove("selected");
            });
            
            // Select the clicked button
            button.classList.add("selected");
        });
    });
</script>
