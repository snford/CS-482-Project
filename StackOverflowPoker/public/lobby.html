<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Lobby - Stack Overflow Poker</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Navigation bar -->
    <nav class="navbar navbar-expand-sm navbar-dark navbar-purple">
        <div class="container-fluid">
          <!-- Links -->
              <ul class="navbar-nav">
                <li class="nav-item">
                  <a class="nav-link" href="home.html"><span class="logo-placeholder">Logo</span></a>
                </li>
                <li class="nav-item">
                  <a class="nav-link mt-2" href="lobby.html">Lobby</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link mt-2" href="friends.html">Friends</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link mt-2" href="stats.html">Stats</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link mt-2" href="profile.html">Profile</a>
                </li>
              </ul>
        </div>
    </nav>

    <div class="container mt-5">
        <h1 class="text-center mb-4">
          Lobby
        </h1>
        
        <a href="createtable.html" class="btn btn-primary">Create Table</a>
        
        <div class="mt-3 mb-4">
            <label for="privateTableCode">Private Table Invite Code:</label>
        
            <input
                type="text"
                id="privateTableCode"
                class="form-control"
                placeholder="Enter invite code">
        
            <button
                type="button"
                class="btn btn-primary mt-2"
                onclick="joinPrivateTable()">
                Join Private Table
            </button>
        </div>
        
        <h3 class="mt-4">Available Tables</h3>

        <p id="tableMessage">Loading tables...</p>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Table Name</th>
                    <th>Players</th>
                    <th>Status</th>
                    <th>Join</th>
                </tr>
            </thead>
            <tbody id="tablesList">
            </tbody>
        </table>
    </div>

<script>

async function joinPrivateTable() {
    const code = document.getElementById("privateTableCode").value.trim();

    if (!code) {
        alert("Please enter an invite code.");
        return;
    }
    const username = prompt("Enter your username:");

    if (!username || !username.trim()) {
        return;
    }
    try {
        const response = await fetch("/api/tables/join", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                tableId: code,
                username: username.trim()
            })
        });
        const result = await response.json();
        alert(result.msg);
        if (response.ok) {
            location.reload();
        }

    } catch (error) {
        alert("Could not join private table.");
    }
}
    
async function showTables() {
    const message = document.getElementById("tableMessage");
    const list = document.getElementById("tablesList");

    try {
        const response = await fetch("/api/tables");
        const tables = await response.json();

        if (tables.length === 0) {
            message.textContent = "No tables available.";
            return;
        }

        message.textContent = "";

        for (const table of tables) {
            const row = list.insertRow();

            row.insertCell().textContent = table.name;
            row.insertCell().textContent =
                table.players.length + "/" + table.maxPlayers;
            row.insertCell().textContent = table.status;

            const joinCell = row.insertCell();

            if (table.status === "waiting" &&
                table.players.length < table.maxPlayers) {

                const button = document.createElement("button");
                button.textContent = "Join";
                button.className = "btn btn-primary btn-sm";
                
                button.onclick = async function() {
                    const username = prompt("Enter your username:");
                
                    if (!username || username.trim() === "") {
                        return;
                    }
                
                    try {
                        const response = await fetch("/api/tables/join", {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({
                                tableId: table._id,
                                username: username.trim()
                            })
                        });
                
                        const result = await response.json();
                        alert(result.msg);
                
                        if (response.ok) {
                            window.location.href = `/table/${table._id}`;
                        }
                
                    } catch (error) {
                        alert("Could not join table.");
                    }
                };
                
                joinCell.appendChild(button);
            }
        }

    } catch (error) {
        message.textContent = "Could not load tables.";
    }
}

showTables();
</script>
    
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
